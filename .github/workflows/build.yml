name: build
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '.claude/**']
  pull_request:
    paths-ignore: ['**/*.md', '.claude/**']
  # run by hand (Actions tab or `gh workflow run build.yml --ref main`) when a run is lost, e.g. in a GitHub outage
  workflow_dispatch:

# a new push to a PR cancels that PR's older run, so stale runs don't hold the scarce macOS runners
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc
      - run: npm test

  # The card relay (relay/): its Worker under wrangler dev, driven by the app's own client crypto
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: '**/package-lock.json' }
      - run: npm ci
      - run: npm ci
        working-directory: relay
      - run: npm run typecheck
        working-directory: relay
      - run: npm test
        working-directory: relay

  # The editing mechanics compared with CardMirror's recorded behavior (tests/cardmirror), on each OS.
  parity:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # the browser download is keyed on the lockfile, which pins the Playwright version
      - uses: actions/cache@v4
        with:
          path: .playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
      - run: npm run build
      - name: Keyboard and mouse parity with CardMirror
        shell: bash
        run: |
          npx vite preview --port 5173 --strictPort &
          npx wait-on tcp:5173
          node scripts/probe.mjs falcon | tail -40
          node scripts/mouse.mjs falcon | tail -2
          node scripts/paste-word.mjs | tail -1

  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # electron-builder skips signing on PR builds to protect certificates; the Mac
          # signature is ad-hoc (no secrets), and an unsigned app opens as "damaged"
          CSC_FOR_PULL_REQUEST: true
      # an unsealed signature makes macOS call the downloaded app "damaged"
      - name: Verify the Mac signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 release/mac*/Falcon.app
      # launch the packaged app (hidden window), type and format a card with the real keys, and check it
      - name: Smoke test the packaged app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then exe="release/win-unpacked/Falcon.exe"; else exe="$(ls -d release/mac*/Falcon.app)/Contents/MacOS/Falcon"; fi
          FALCON_EXE="$exe" node scripts/electron-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: shots/electron-*.png
      - uses: actions/upload-artifact@v4
        with:
          name: falcon-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error
