<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src file:">
<style>
  /* Falcon's Save As dialog. This window can't read the app's styles, so its colors and font come in the URL. */
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 22px 22px 18px; background: var(--u-card); color: var(--u-tx); font: 13px/19px 'Falcon UI', var(--ui-font); -webkit-font-smoothing: antialiased; user-select: none; overflow: hidden; }
  label { display: block; margin-bottom: 12px; font-size: 15px; font-weight: 600; line-height: 20px; }
  input { display: block; width: 100%; height: 34px; padding: 0 12px; border: 0; border-radius: 8px; background: var(--u-ctl2); color: var(--u-tx); font: inherit; box-shadow: var(--u-top); outline: none; }
  input:focus-visible { outline: 2px solid var(--u-tx2); outline-offset: 2px; }
  p { margin: 12px 0 0; color: var(--u-tx2); }
  .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  button { height: 32px; padding: 0 14px; border: 0; border-radius: 8px; background: var(--u-ctl2); color: var(--u-tx); font: inherit; box-shadow: var(--u-top); cursor: pointer; transition: background 150ms ease-out; }
  button:hover { background: var(--u-ctl-on); }
  button:focus-visible { outline: 2px solid var(--u-tx2); outline-offset: 2px; }
</style></head>
<body>
  <label id="l" for="v"></label>
  <input id="v" type="password" spellcheck="false" autocomplete="off" autofocus>
  <p id="n">Saved encrypted on this computer. Falcon's pages never see it.</p>
  <div class="row"><button id="c">Cancel</button><button id="s">Save</button></div>
<script>
  const q = new URLSearchParams(location.search);
  for (const [k, val] of q) if (k.startsWith('--')) document.documentElement.style.setProperty(k, val);
  if (q.get('font')) document.fonts.add(new FontFace('Falcon UI', `url("${q.get('font')}")`, { weight: '100 900' }));
  const label = q.get('label') || 'Secret';
  document.getElementById('l').textContent = label; document.title = label;
  if (q.get('note')) document.getElementById('n').textContent = q.get('note');
  if (q.get('button')) document.getElementById('s').textContent = q.get('button');
  const v = document.getElementById('v');
  const save = () => window.secret.submit(v.value);
  document.getElementById('s').onclick = save;
  document.getElementById('c').onclick = () => window.close();
  v.onkeydown = (e) => { if (e.key === 'Enter') save(); if (e.key === 'Escape') window.close(); };
</script>
</body></html>
