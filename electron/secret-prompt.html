<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
  :root { color-scheme: light dark; font: 13px system-ui, sans-serif; }
  body { margin: 0; padding: 16px; display: grid; gap: 10px; }
  input { font: inherit; padding: 6px 8px; }
  .row { display: flex; gap: 8px; justify-content: flex-end; }
  p { margin: 0; opacity: .7; }
</style></head>
<body>
  <label id="l" for="v"></label>
  <input id="v" type="password" spellcheck="false" autocomplete="off" autofocus>
  <p>Saved encrypted on this computer. Falcon's pages never see it.</p>
  <div class="row"><button id="c">Cancel</button><button id="s">Save</button></div>
<script>
  const label = new URLSearchParams(location.search).get('label') || 'Secret';
  document.getElementById('l').textContent = label; document.title = label;
  const v = document.getElementById('v');
  const save = () => window.secret.submit(v.value);
  document.getElementById('s').onclick = save;
  document.getElementById('c').onclick = () => window.close();
  v.onkeydown = (e) => { if (e.key === 'Enter') save(); if (e.key === 'Escape') window.close(); };
</script>
</body></html>
