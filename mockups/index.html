<!doctype html><html><head><meta charset="utf-8"><title>Falcon mockups</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;background:#0b0c0f;color:#e8e9ee;font:13px -apple-system,"SF Pro Text",Inter,sans-serif}
header{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid #22242b}
b{font-weight:650;margin-right:12px}
button{background:transparent;color:#a3a6b2;border:1px solid transparent;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer;transition:all .15s ease-out}
button:hover{color:#fff;background:#1a1c22}button.on{color:#fff;background:#1f2230;border-color:#343a52}
kbd{font:11px ui-monospace,monospace;color:#7d8191;margin-left:6px}
span.note{margin-left:auto;color:#7d8191}
iframe{flex:1;border:0;width:100%;background:#000}
</style></head><body>
<header><b>Falcon mockups</b>
<button data-f="a-command.html">A · Command<kbd>1</kbd></button>
<button data-f="b-round.html">B · Round<kbd>2</kbd></button>
<button data-f="c-library.html">C · Library<kbd>3</kbd></button>
<span class="note">Click into a mockup to use its shortcuts</span></header>
<iframe id="f"></iframe>
<script>
const bs=[...document.querySelectorAll('button')],f=document.getElementById('f');
function go(i){bs.forEach((b,j)=>b.classList.toggle('on',i===j));f.src=bs[i].dataset.f;location.hash=i+1}
bs.forEach((b,i)=>b.onclick=()=>go(i));
addEventListener('keydown',e=>{if(['1','2','3'].includes(e.key))go(+e.key-1)});
go(Math.max(0,(+location.hash.slice(1)||1)-1));
</script></body></html>
