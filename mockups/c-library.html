<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Falcon — Library</title>
<meta name="viewport" content="width=1440">
<style>
:root{--ui:-apple-system,"SF Pro Text","SF Pro",BlinkMacSystemFont,"Inter",system-ui,"Segoe UI",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--e:cubic-bezier(.2,.8,.2,1);--acc:#7c8cff}
[data-theme=dark]{--bg:#0d0e11;--side:#111216;--panel:#16181c;--elev:#1e2026;--sunk:#121418;--hov:rgba(255,255,255,.045);--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);--tx:#e8e9ec;--tx2:#a0a4ad;--tx3:#6c717b;--aff:#86b4ff;--affb:rgba(96,150,255,.14);--neg:#ff95a6;--negb:rgba(255,100,130,.13);--hl:#5fe9eb;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);--scrim:rgba(0,0,0,.35)}
[data-theme=light]{--bg:#f7f7f5;--side:#efefec;--panel:#fff;--elev:#fff;--sunk:#f1f1ee;--hov:rgba(0,0,0,.04);--line:rgba(0,0,0,.07);--line2:rgba(0,0,0,.12);--tx:#1b1c1f;--tx2:#5d6169;--tx3:#8c9099;--aff:#2563eb;--affb:rgba(37,99,235,.09);--neg:#d1294b;--negb:rgba(209,41,75,.08);--hl:#00ffff;--sh:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.07);--scrim:rgba(20,20,30,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{font:13px/1.45 var(--ui);background:var(--bg);color:var(--tx);height:100vh;overflow:hidden;display:grid;grid-template-columns:264px 1fr;-webkit-font-smoothing:antialiased;transition:background .2s var(--e),color .2s var(--e)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
kbd{font:500 10.5px var(--ui);color:var(--tx3);border:1px solid var(--line2);border-radius:4px;padding:1px 5px;background:var(--hov)}
/* sidebar */
aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 8px;overflow:hidden;transition:background .2s var(--e)}
.lights{display:flex;gap:8px;padding:4px 8px 16px}.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.spaces{display:flex;gap:4px;padding:0 0 8px}
.spb{flex:1;height:40px;border-radius:8px;display:grid;place-items:center;color:var(--tx3);border:1px solid transparent;transition:all .18s var(--e);position:relative}
.spb:hover{background:var(--hov);color:var(--tx2)}
.spb.on{background:var(--elev);color:var(--acc);border-color:var(--line);box-shadow:var(--sh)}
.sphead{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 4px}
.sphead b{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.newtab{margin:8px 0 0;height:32px;border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 8px;color:var(--tx2);width:100%;transition:background .15s var(--e)}
.newtab:hover{background:var(--hov);color:var(--tx)}.newtab kbd{margin-left:auto}
#sb{flex:1;overflow:auto;transition:transform .18s var(--e),opacity .18s var(--e)}
.sec{font-size:11px;font-weight:600;color:var(--tx3);letter-spacing:.04em;text-transform:uppercase;padding:16px 8px 6px;display:flex;justify-content:space-between}
.pins{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 0 4px}
.pin{border:1px solid var(--line);background:var(--elev);border-radius:8px;padding:8px;text-align:left;font-size:12px;line-height:1.3;transition:all .18s var(--e);display:flex;flex-direction:column;gap:6px;min-height:56px}
.pin:hover{border-color:var(--line2);transform:translateY(-1px);box-shadow:var(--sh)}
.pin span{color:var(--tx2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.it{height:32px;border-radius:6px;display:flex;align-items:center;gap:8px;padding:0 8px;width:100%;text-align:left;color:var(--tx2);transition:background .15s var(--e),color .15s var(--e)}
.it:hover{background:var(--hov);color:var(--tx)}
.it.on{background:var(--elev);color:var(--tx);box-shadow:var(--sh);border:1px solid var(--line)}
.it .nm{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.it .x{opacity:0;width:20px;height:20px;border-radius:4px;display:grid;place-items:center;color:var(--tx3);transition:opacity .15s}
.it:hover .x{opacity:1}.it .x:hover{background:var(--hov);color:var(--tx)}
.it .x svg{width:12px;height:12px}
.it.cl{color:var(--tx3)}.it.cl .x{opacity:0}
.it.flash{animation:fl .9s var(--e)}
@keyframes fl{0%{background:color-mix(in srgb,var(--acc) 30%,transparent)}100%{background:transparent}}
.fi{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font:700 9px var(--ui);flex:none}
.fi.Aff{background:var(--affb);color:var(--aff)}.fi.Neg{background:var(--negb);color:var(--neg)}
.foot{border-top:1px solid var(--line);padding:8px 0 0;display:flex;gap:4px}
.ib{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--tx2);transition:all .15s var(--e)}
.ib:hover{background:var(--hov);color:var(--tx)}
/* main */
main{overflow:auto;position:relative}
.top{position:sticky;top:0;z-index:5;height:48px;display:flex;align-items:center;gap:8px;padding:0 24px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.crumb{color:var(--tx3);display:flex;gap:8px;align-items:center}.crumb b{color:var(--tx);font-weight:500}
.sync{margin-left:auto;color:var(--tx3);font-size:12px;display:flex;align-items:center;gap:6px}.sync i{width:6px;height:6px;border-radius:50%;background:#3fcf8e}
.wrap{max-width:1096px;margin:0 auto;padding:48px 48px 96px}
.hi{color:var(--tx3);font-size:13px;margin-bottom:8px}
h1{font-size:28px;font-weight:650;letter-spacing:-.02em;margin-bottom:24px}
.search{position:relative}
.search input{width:100%;height:56px;border-radius:14px;border:1px solid var(--line2);background:var(--panel);color:var(--tx);font:400 17px var(--ui);padding:0 96px 0 52px;outline:none;box-shadow:var(--sh);transition:border-color .18s var(--e),box-shadow .18s var(--e)}
.search input::placeholder{color:var(--tx3)}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent),var(--sh)}
.search>svg{position:absolute;left:20px;top:20px;color:var(--tx3)}
.search .k{position:absolute;right:16px;top:18px;display:flex;gap:6px;align-items:center;color:var(--tx3);font-size:12px}
.qs{display:flex;gap:8px;margin:24px 0 40px;align-items:stretch}
.qlab{font-size:11px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;padding:4px 0}
.qc{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;position:relative;transition:all .18s var(--e)}
.qc:hover{border-color:var(--line2);box-shadow:var(--sh);transform:translateY(-1px)}
.qc code{font:600 12px var(--mono);color:var(--acc)}
.qc p{color:var(--tx2);font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qa{position:absolute;right:8px;top:8px;display:flex;gap:2px;opacity:0;transition:opacity .15s var(--e)}
.qc:hover .qa{opacity:1}
.qa button{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--tx2);background:var(--elev);border:1px solid var(--line)}
.qa button:hover{color:var(--tx);border-color:var(--line2)}.qa svg{width:13px;height:13px}
.dbh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.dbh h2{font-size:16px;font-weight:600}.cnt{color:var(--tx3);font-size:12px}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{height:26px;padding:0 10px;border-radius:6px;color:var(--tx2);display:flex;align-items:center;gap:6px;font-size:12px;transition:all .15s var(--e)}
.seg button.on{background:var(--elev);color:var(--tx);box-shadow:var(--sh)}
.seg svg{width:14px;height:14px}
.ml{margin-left:auto}
.fr{display:flex;gap:8px;align-items:center;margin-bottom:16px;position:relative}
.fb{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line2);color:var(--tx2);font-size:12px;display:flex;align-items:center;gap:6px;transition:all .15s var(--e)}
.fb:hover{color:var(--tx);background:var(--hov)}
.fb.act{border-color:color-mix(in srgb,var(--acc) 55%,transparent);color:var(--tx);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.fb svg{width:12px;height:12px}
.clr{color:var(--tx3);font-size:12px;padding:0 4px}.clr:hover{color:var(--tx)}
.pop{position:absolute;top:34px;z-index:20;min-width:180px;background:var(--elev);border:1px solid var(--line2);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.3);padding:4px;opacity:0;transform:translateY(-4px) scale(.98);pointer-events:none;transition:all .16s var(--e)}
.pop.open{opacity:1;transform:none;pointer-events:auto}
.opt{display:flex;align-items:center;gap:8px;width:100%;height:30px;padding:0 8px;border-radius:6px;text-align:left;font-size:12.5px}
.opt:hover{background:var(--hov)}
.ck{width:14px;height:14px;border-radius:4px;border:1px solid var(--line2);display:grid;place-items:center}
.opt.on .ck{background:var(--acc);border-color:var(--acc);color:#fff}.ck svg{width:10px;height:10px;stroke-width:2.4;opacity:0}.opt.on .ck svg{opacity:1}
.db{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;font-weight:500;color:var(--tx3);text-align:left;height:36px;padding:0 12px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap;transition:color .15s}
th:hover{color:var(--tx)}th.s{color:var(--tx)}th .ar{opacity:.8;margin-left:4px;font-size:10px}
td{height:44px;padding:0 12px;border-top:1px solid var(--line);white-space:nowrap}
tr:first-child td{border-top:0}
tbody tr{cursor:pointer;transition:background .12s var(--e)}
tbody tr:hover{background:var(--hov)}tbody tr.sel{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.nmc{display:flex;align-items:center;gap:10px;font-weight:500}
.nmc em{font-style:normal;background:color-mix(in srgb,var(--acc) 30%,transparent);border-radius:3px}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font-size:11.5px;font-weight:500;margin-right:4px}
.chip.Aff{background:var(--affb);color:var(--aff)}.chip.Neg{background:var(--negb);color:var(--neg)}
.ty{color:var(--tx2);display:flex;align-items:center;gap:6px}.ty i{width:6px;height:6px;border-radius:2px}
.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--tx2)}
.mut{color:var(--tx2)}.mut3{color:var(--tx3)}
.empty{padding:48px;text-align:center;color:var(--tx3)}.empty button{color:var(--acc);margin-top:8px}
.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;overflow-x:auto}
.col{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:240px;transition:border-color .15s,background .15s}
.col.over{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--sunk))}
.colh{display:flex;align-items:center;gap:6px;padding:4px 4px 8px;font-size:12px;font-weight:600}
.colh span{color:var(--tx3);font-weight:400}
.bc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.12);transition:transform .15s var(--e),box-shadow .15s var(--e),opacity .15s}
.bc:hover{transform:translateY(-1px);box-shadow:var(--sh)}
.bc.drag{opacity:.4}
.bc b{display:block;font-weight:500;font-size:12.5px;margin-bottom:8px;line-height:1.3}
.bc .m{display:flex;align-items:center;flex-wrap:wrap;gap:4px 0}.bc .m small{margin-left:auto;color:var(--tx3);font-size:11px}
/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s var(--e);z-index:30}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:576px;background:var(--panel);border-left:1px solid var(--line2);box-shadow:-24px 0 64px rgba(0,0,0,.35);z-index:31;transform:translateX(104%);transition:transform .22s var(--e);display:flex;flex-direction:column}
.drawer.open{transform:none}
.dh{padding:16px 16px 16px 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.dh h3{font-size:16px;font-weight:600;flex:1}
.dbd{flex:1;overflow:auto;padding:16px 24px 24px}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.meta div{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.meta small{display:block;color:var(--tx3);font-size:11px}.meta b{font-weight:500;font-size:12.5px}
.lbl{font-size:11px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em;margin:8px 0}
.ol{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:16px;font-size:12.5px}
.ol div{display:flex;align-items:center;gap:8px;height:26px;padding:0 6px;border-radius:5px}
.ol div:hover{background:var(--hov)}
.ol .p{font-weight:650}.ol .h{padding-left:20px;font-weight:600;color:var(--tx)}.ol .b{padding-left:36px;color:var(--tx2)}
.ol small{margin-left:auto;color:var(--tx3);font-size:11px}
.ol i{font-style:normal;font:600 9.5px var(--mono);color:var(--tx3);width:22px}
.df{padding:12px 24px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.btn{height:32px;padding:0 14px;border-radius:8px;font-weight:500;display:flex;align-items:center;gap:8px;border:1px solid var(--line2);transition:all .15s var(--e)}
.btn:hover{background:var(--hov)}
.btn.pr{background:var(--acc);border-color:transparent;color:#fff}.btn.pr:hover{filter:brightness(1.08)}
.btn.pr kbd{color:#fff;border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.12)}
/* paper */
.paper{background:#fdfdfa;color:#111;font-family:"Times New Roman",Times,Georgia,serif;border-radius:4px;padding:32px 36px 24px;box-shadow:0 1px 3px rgba(0,0,0,.2),0 12px 32px rgba(0,0,0,.18);position:relative;max-height:620px;overflow:hidden}
.paper .blk{text-align:center;font-weight:700;text-decoration:underline;font-size:17px;margin:0 0 14px}
.paper .tag{font-weight:700;font-size:14.5px;line-height:1.35;margin-bottom:4px}
.paper .cite{font-size:13.5px;margin-bottom:8px;line-height:1.35}.paper .cite small{font-size:10px;color:#222}
.paper .body{font-size:13.5px;line-height:1.5;text-align:left}
.paper .body small{font-size:9.5px;color:#333}
.paper u{text-decoration-thickness:1px;text-underline-offset:2px}
.paper mark{background:var(--hl);color:inherit;padding:0 1px}
.paper .blk2{margin-top:24px}
.paper .fade{position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(transparent,#fdfdfa 70%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:16px;font:500 12px var(--ui);color:#666}
.toast{position:fixed;bottom:24px;left:calc(50% + 132px);transform:translate(-50%,16px);background:var(--elev);border:1px solid var(--line2);box-shadow:var(--sh);border-radius:10px;padding:8px 14px;font-size:12.5px;opacity:0;transition:all .2s var(--e);z-index:50;display:flex;gap:8px;align-items:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}.toast svg{color:#3fcf8e}
.mock{position:fixed;right:12px;bottom:8px;font-size:10px;color:var(--tx3);opacity:.7;z-index:60;pointer-events:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
</style>
</head>
<body>
<aside>
  <div class="lights"><i></i><i></i><i></i></div>
  <div class="spaces" id="spaces"></div>
  <div class="sphead"><b><span class="dot"></span><span id="spname">Glenbrooks</span></b><kbd id="spk">⌘1</kbd></div>
  <button class="newtab" id="nt"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>New tab<kbd>⌘T</kbd></button>
  <div id="sb"></div>
  <div class="foot">
    <button class="ib" id="theme" title="Toggle theme"><svg viewBox="0 0 16 16" id="thi"><path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.5 5.5 0 1 0 6.5 6.5z"/></svg></button>
    <button class="ib" title="Settings"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
  </div>
</aside>
<main id="main">
  <div class="top">
    <div class="crumb"><span id="cr">Glenbrooks</span><span>/</span><b>New Tab</b></div>
    <div class="sync"><i></i>Synced to team · 2 min ago</div>
  </div>
  <div class="wrap">
    <div class="hi" id="greet">Good evening, Maya</div>
    <h1>What are we reading?</h1>
    <div class="search">
      <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
      <input id="q" placeholder="Search files, blocks, cards…" autocomplete="off" spellcheck="false">
      <div class="k"><span id="qn"></span><kbd>/</kbd></div>
    </div>
    <div class="qs" id="qs"></div>
    <div class="dbh">
      <h2>Library</h2><span class="cnt" id="cnt"></span>
      <div class="seg ml" id="vw">
        <button data-v="table" class="on"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M2 6.5h12M2 10h12M6 6.5V13"/></svg>Table</button>
        <button data-v="board"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="3.5" height="10" rx="1"/><rect x="6.25" y="3" width="3.5" height="7" rx="1"/><rect x="10.5" y="3" width="3.5" height="5" rx="1"/></svg>Board</button>
      </div>
    </div>
    <div class="fr" id="fr">
      <div class="seg" id="sideSeg"><button class="on" data-s="All">All sides</button><button data-s="Aff">Aff</button><button data-s="Neg">Neg</button></div>
      <button class="fb" data-p="type">Type <span></span><svg viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></svg></button>
      <button class="fb" data-p="tag">Tags <span></span><svg viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></svg></button>
      <button class="clr" id="clr" style="display:none">Clear filters</button>
      <div class="pop" id="pop"></div>
    </div>
    <div id="view"></div>
  </div>
</main>
<div class="scrim" id="scrim"></div>
<div class="drawer" id="dr">
  <div class="dh"><span class="fi" id="dfi"></span><h3 id="dt"></h3><kbd>esc</kbd><button class="ib" id="dx"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
  <div class="dbd" id="dbd"></div>
  <div class="df"><button class="btn pr" id="dopen">Open<kbd>↵</kbd></button><button class="btn" id="dsplit">Open in split</button><span class="ml mut3" style="font-size:12px" id="dmod"></span></div>
</div>
<div class="toast" id="toast"><svg viewBox="0 0 16 16"><path d="m3.5 8.5 3 3 6-7"/></svg><span></span></div>
<div class="mock">Falcon mock C — Library</div>

<template id="dib">
<div class="blk">Uniqueness---1AC</div>
<div class="tag">Reshoring is stalling NOW. Data centers are outcompeting factories for grid capacity, and transformer lead times alone can disqualify a plant.</div>
<div class="cite"><b>Segers 26</b> <small>[Alexandra; July 9, 2026; General Manager, Tochi Advisors, 15+ years managing international projects including the design and construction of new manufacturing facilities; Area Development, "The New Rules of Industrial Site Selection" series, "Power Is the New Gatekeeper in Manufacturing Site Selection," areadevelopment.com; accessed 2026-08-14]</small></div>
<div class="body"><small>SUMMARY, not verbatim --- Segers frames this as a reversal in how manufacturers pick a site: the old sequence solved for the labor market and incentives first and confirmed infrastructure last, as a formality.</small> <u>That <mark>order has flipped</mark></u><small>. For large manufacturing projects today—auto plants, battery fabs, semiconductor facilities—</small><u>the <mark>first question</mark> is <mark>no longer</mark> about <mark>workers or tax credits</mark>. It is about <mark>power</mark></u><small>. And the second question is</small> <u>whether that power can actually be <mark>delivered within the</mark> project <mark>timeline</mark></u><small>. SUMMARY, not verbatim --- She sizes the input that can sink a project outright: equipment delivery alone can outlast a manufacturer's production ramp schedule.</small> <u><mark>Transformer lead times</mark> currently <mark>run</mark> between <mark>18 and 36 months</mark></u><small>. For a manufacturer planning an aggressive ramp to production,</small> <u>that <mark>single constraint can be disqualifying</mark></u><small>. A site without a clear path to power—regardless of its other advantages—is a site that gets crossed off the list early. SUMMARY, not verbatim --- The piece reframes the competition itself: it is no longer manufacturer versus manufacturer for a site, it is manufacturer versus data center for the same finite grid capacity. Manufacturing projects are no longer competing only against other manufacturing projects.</small> <u>They are <mark>competing with data centers</mark>—which are <mark>proliferating rapidly</mark>, require enormous power loads, and are often prepared to <mark>move faster and pay more</mark></u><small>. In markets where grid capacity is limited,</small> <u>a <mark>data center can absorb</mark> available <mark>infrastructure before a manufacturer's project clears</mark> due diligence</u><small>.</small></div>

}

/* new tab / theme */
$('#nt').onclick=()=>{qi.focus();qi.select()};
const MOON='<path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.5 5.5 0 1 0 6.5 6.5z"/>',SUN='<circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/>';
$('#theme').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark';r.dataset.theme=d?'light':'dark';$('#thi').innerHTML=d?SUN:MOON};

/* keyboard */
document.addEventListener('keydown',e=>{
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&['1','2','3'].includes(e.key)){e.preventDefault();setSpace(+e.key-1);return}
  if(mod&&e.key.toLowerCase()==='t'){e.preventDefault();qi.focus();qi.select();return}
  if(e.key==='Escape'){if(popK){closePop();return}if($('#dr').classList.contains('open'))closePeek();return}
  const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if(e.key==='/'&&!typing){e.preventDefault();closePeek();qi.focus();qi.select();return}
  if(e.key==='Enter'&&!typing&&$('#dr').classList.contains('open')){e.preventDefault();doOpen(0)}
});

const h=new Date().getHours();$('#greet').textContent=(h<12?'Good morning':h<18?'Good afternoon':'Good evening')+', Maya · Glenbrooks starts in 3 days';
renderSpaces();renderSide();render();
</script>
</body>
</html>
